; Configuración de escritura-por-voz.
; Todos los valores configurables del sistema se definen aquí; el código nunca
; tiene constantes propias, solo lee de este fichero.

[general]
; Motor de transcripción activo: "whisper" (faster-whisper, GPU) o "vosk" (CPU, sin conexión).
motor = whisper
; Ruta del fichero PID para garantizar una sola instancia en marcha.
; $XDG_RUNTIME_DIR se expande al directorio de runtime del usuario (p. ej. /run/user/1000).
; En una sesión gráfica con systemd siempre existe. /tmp es solo la ruta de respaldo
; para entornos sin systemd o sin sesión de usuario (SSH sin ForwardX11, scripts de arranque).
fichero_pid = $XDG_RUNTIME_DIR/escritura-por-voz.pid

[tecla]
; Combinación de tecla global capturada con XGrabKey (X11).
; Formato: uno o más modificadores (Control, Shift, Alt, Mod4) separados por +,
; seguidos del keysym X11. Ejemplo: "Control+Escape", "Mod4+v".
combinacion = Control+Escape

[audio]
; Frecuencia de muestreo en Hz. Whisper y VOSK esperan 16000.
frecuencia_muestreo = 16000
; Número de canales de audio (1 = mono, que es lo que esperan ambos motores).
canales = 1
; Duración mínima de la grabación en segundos. Las más cortas se ignoran para
; evitar transcripciones de ruidos accidentales al pulsar la tecla.
duracion_minima_s = 0.3

[whisper]
; Identificador del modelo faster-whisper. "large-v3-turbo" equilibra precisión y velocidad.
; Alternativas: "base", "small", "medium", "large-v3".
modelo = large-v3-turbo
; Dispositivo de inferencia: "cuda" para GPU NVIDIA, "cpu" como alternativa.
dispositivo = cuda
; Tipo de cómputo. En GPU: float16 (recomendado). En CPU: int8.
tipo_computo = float16
; Código de idioma BCP-47. "es" para español.
idioma = es
; Activa el filtro VAD (Voice Activity Detection) de Silero integrado en faster-whisper.
; Reduce alucinaciones en silencios y ruido de fondo.
filtro_vad = true
; Tamaño del haz (beam search). Valores mayores mejoran la precisión a costa de velocidad.
tamano_haz = 5
; Vocabulario técnico opcional para mejorar el reconocimiento de jerga o nombres propios.
; Se pasa como initial_prompt a faster-whisper. Dejar vacío si no se necesita.
prompt_inicial =

[salida]
; Si es true, añade un espacio al final del texto pegado para separar del siguiente dictado.
espacio_final = true
; Selecciones X11 a las que se copia el texto, separadas por comas.
; Valores permitidos: clipboard, primary. Al menos una. Sin duplicados.
;   clipboard — portapapeles explícito (Ctrl+V en GTK/Firefox, Ctrl+Shift+V en WezTerm).
;   primary   — selección activa; se pega con Shift+Insert en WezTerm y xterm.
; Copiar a ambas garantiza que la tecla shift+Insert funcione en WezTerm/xterm Y en GTK/Firefox.
selecciones = clipboard,primary
; Combinación que xdotool envía para pegar.
; shift+Insert pega PRIMARY en WezTerm/xterm y CLIPBOARD en GTK (Firefox, gedit…).
; Es la única tecla universal: Ctrl+V no pega en WezTerm; Ctrl+Shift+V no pega en GTK.
tecla_pegar = shift+Insert

[vosk]
; Ruta al directorio del modelo VOSK, relativa a la raíz del repositorio.
; El modelo español pequeño viene incluido en model/.
directorio_modelo = model
